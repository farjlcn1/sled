# OpenDKIM -- podpisuje odhodno posto iz nasega Postfixa (DKIM), da jo prejemniki (Gmail,
# Outlook ...) lazje prepoznajo kot pristno in ne kot spoofing/spam. Namescen na
# /etc/opendkim.conf (glej setup.sh).
Syslog                  yes
UMask                   007
Mode                    s
Domain                  farjolcn.com
Selector                mail
KeyFile                 /etc/opendkim/keys/farjolcn.com/mail.private
Socket                  inet:8891@127.0.0.1
PidFile                 /run/opendkim/opendkim.pid
UserID                  opendkim:opendkim
Canonicalization        relaxed/simple

# Komu zaupamo, da bomo NJIHOVO poslano posto podpisali -- localhost (Postfix) + docker
# bridge omrezja za sled/teren (172.18.0.0/16, 172.19.0.0/16), oboje pokrito s 172.16.0.0/12.
InternalHosts           /etc/opendkim/TrustedHosts
ExternalIgnoreList      /etc/opendkim/TrustedHosts
